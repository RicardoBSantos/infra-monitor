spring:
  application:
    name: infra-monitor-backend

  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inframonitor}
    username: ${DB_USERNAME:inframonitor}
    password: ${DB_PASSWORD:inframonitor}
    hikari:
      pool-name: inframonitor-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Schema e responsabilidade exclusiva do Flyway.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    # Jackson 3 ja serializa datas em ISO-8601 por padrao; aqui fixamos o fuso em UTC.
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Somente health: demais endpoints administrativos ficam fechados.
        include: health
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

monitoring:
  engine:
    # Enable explicitly on the single backend instance responsible for monitoring.
    enabled: ${MONITORING_ENGINE_ENABLED:false}
    scheduler-delay-ms: ${MONITORING_ENGINE_SCHEDULER_DELAY_MS:1000}
    worker-threads: ${MONITORING_ENGINE_WORKER_THREADS:4}
    queue-capacity: ${MONITORING_ENGINE_QUEUE_CAPACITY:100}

notification:
  telegram:
    enabled: ${NOTIFICATION_TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    connect-timeout-ms: ${NOTIFICATION_TELEGRAM_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${NOTIFICATION_TELEGRAM_READ_TIMEOUT_MS:5000}
  dispatcher:
    enabled: ${NOTIFICATION_DISPATCHER_ENABLED:false}
    poll-delay-ms: ${NOTIFICATION_DISPATCHER_POLL_DELAY_MS:1000}
    batch-size: ${NOTIFICATION_DISPATCHER_BATCH_SIZE:50}
    worker-threads: ${NOTIFICATION_DISPATCHER_WORKER_THREADS:5}
    queue-capacity: ${NOTIFICATION_DISPATCHER_QUEUE_CAPACITY:100}
    max-attempts: ${NOTIFICATION_DISPATCHER_MAX_ATTEMPTS:3}
    base-delay-seconds: ${NOTIFICATION_DISPATCHER_BASE_DELAY_SECONDS:30}
    processing-timeout-ms: ${NOTIFICATION_DISPATCHER_PROCESSING_TIMEOUT_MS:60000}
