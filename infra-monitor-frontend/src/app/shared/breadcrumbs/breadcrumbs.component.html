<nav class="breadcrumbs" aria-label="Navegação estrutural">
  @for (breadcrumb of breadcrumbs(); track breadcrumb.label + breadcrumb.url; let last = $last) {
    @if (last) { <span aria-current="page">{{ breadcrumb.label }}</span> }
    @else if (breadcrumb.url) { <a [routerLink]="breadcrumb.url">{{ breadcrumb.label }}</a><app-icon name="chevron-right" /> }
    @else { <span class="breadcrumbs__section">{{ breadcrumb.label }}</span><app-icon name="chevron-right" /> }
  }
</nav>
