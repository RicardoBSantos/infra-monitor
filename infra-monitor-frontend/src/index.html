<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>InfraMonitorFrontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Tela de espera do bootstrap (refresh da sessão em voo). O Angular a substitui ao criar o componente
       raiz. Sem script nem handler inline: a CSP é script-src 'self' e o ci-frontend barra.
       Fonte do sistema: a IBM Plex vem no bundle e ainda não carregou. Cores = tokens --im-* do tema. -->
  <style>
    .im-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; margin: 0; background: #090C14; color: #E8EDF5; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
    .im-splash__marca { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    .im-splash__status { font-size: 13px; color: #94a1af; }
    @media (prefers-color-scheme: light) {
      .im-splash { background: #f4f6f9; color: #101828; }
      .im-splash__status { color: #51596a; }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="im-splash" role="status" aria-live="polite">
      <span class="im-splash__marca">Infra Monitor</span>
      <span class="im-splash__status">Restaurando sessão…</span>
    </div>
  </app-root>
</body>
</html>
