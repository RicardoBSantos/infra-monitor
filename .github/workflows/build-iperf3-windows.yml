name: Build iperf3 Windows
# Compila o iperf3 para Windows (Cygwin, sem OpenSSL) a partir do fonte oficial.
# Desenho: Docs/banda-architecture/build-iperf3.md (D9). Independente do fluxo de release
# da aplicacao: nao usa ci-windows-packaging.yml, nao cria tag aprovada/ e o puller (PR #44)
# so le tags aprovada/ e artefatos daquele workflow.
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar o pacote como GitHub Release (iperf3-v<tag>-cygwin.<run>)
        type: boolean
        default: false

permissions:
  contents: read

env:
  IPERF_TAG: '3.22.1'
  IPERF_COMMIT: 'acc0ed500fb2c421999948a72bb6a9e05af528d8'
  # DLLs permitidas FORA de C:\Windows (as do sistema operacional nao entram no pacote).
  ALLOWED_DLLS: 'cygwin1.dll'
  # Constantes entre aspas: hash so com digitos viraria numero no YAML.
  # Runtime Cygwin a que pertence o COPYING.LIB versionado em third-party/ (LGPLv3 do cygwin1.dll).
  # A action instala a versao corrente do espelho: se mudar, o job falha ate o diretorio ser trocado.
  CYGWIN_RUNTIME_VERSION: '3.6.12-1'
  CYGWIN_COPYING_LIB: 'third-party/cygwin-3.6.12/COPYING.LIB'
  CYGWIN_COPYING_LIB_SHA256: 'da7eabb7bafdf7d3ae5e9f223aa5bdc1eece45ac569dc21b3b037520b4464768'
  # Oferta de fonte da LGPL: pacote de fonte da MESMA versao (setup.ini do espelho, 2026-11-23).
  CYGWIN_SRC_URL: 'https://mirrors.kernel.org/sourceware/cygwin/src/release/cygwin/cygwin-3.6.12-1-src.tar.xz'
  CYGWIN_SRC_SHA512: '9d70312a931f06d1158e7e913a23fb4aec4bb5fce6c5b55caf274a6d63905248625beaf1391f2d4518fbf5099523fdab2aa26834651856f4693fbf8862027889'
  CYGWIN_SRC_GIT: 'https://cygwin.com/cgit/newlib-cygwin/ tag cygwin-3.6.12 (commit ed54dcfd953ac0798802d3ef9deec5ff11edb47b)'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail -o igncr '{0}'
    steps:
      # Sem isto o checkout no Windows converte para CRLF e o configure quebra no Cygwin.
      - name: Desligar conversao de fim de linha
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout do iperf3 (tag fixa)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: esnet/iperf
          ref: refs/tags/${{ env.IPERF_TAG }}
          path: iperf-src
          persist-credentials: false

      - name: Checkout dos arquivos de terceiros (este repositorio)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          sparse-checkout: third-party
          persist-credentials: false

      - name: Conferir COPYING.LIB (LGPLv3 do runtime)
        shell: pwsh
        run: |
          $f = Join-Path 'repo' $env:CYGWIN_COPYING_LIB
          if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { "::error::$env:CYGWIN_COPYING_LIB ausente"; exit 1 }
          $h = (Get-FileHash -Algorithm SHA256 -LiteralPath $f).Hash.ToLowerInvariant()
          "SHA-256 $h ; esperado $env:CYGWIN_COPYING_LIB_SHA256"
          if ($h -cne $env:CYGWIN_COPYING_LIB_SHA256) { "::error::SHA-256 do COPYING.LIB nao confere"; exit 1 }

      - name: Conferir commit da tag
        shell: pwsh
        run: |
          $head = (git -C iperf-src rev-parse 'HEAD^{commit}').Trim()
          "HEAD^{commit} = $head ; esperado = $env:IPERF_COMMIT"
          if ($head -cne $env:IPERF_COMMIT) {
            "::error::Tag $env:IPERF_TAG aponta para $head, nao para $env:IPERF_COMMIT (tag movida no upstream?)"
            exit 1
          }

      - name: Instalar Cygwin
        uses: cygwin/cygwin-install-action@5a1b0cd107181fa6bb6bf3f90d500f4fb3132f18 # v7
        with:
          install-dir: C:\cygwin
          packages: gcc-core make
          # Fora do PATH do sistema: o teste funcional prova que o pacote e autossuficiente.
          add-to-path: false

      - name: Registrar versoes do toolchain
        run: |
          export PATH=/usr/bin:/bin
          mkdir -p "$(cygpath -u "$GITHUB_WORKSPACE")/out"
          cygcheck -c cygwin gcc-core make | tee "$(cygpath -u "$GITHUB_WORKSPACE")/out/toolchain.txt"
          uname -a | tee -a "$(cygpath -u "$GITHUB_WORKSPACE")/out/toolchain.txt"
          INSTALADA="$(cygcheck -c -d cygwin | awk '$1=="cygwin"{print $2}')"
          echo "runtime instalado: $INSTALADA ; COPYING.LIB pertence a: $CYGWIN_RUNTIME_VERSION"
          if [ "$INSTALADA" != "$CYGWIN_RUNTIME_VERSION" ]; then
            echo "::error::runtime Cygwin $INSTALADA difere de $CYGWIN_RUNTIME_VERSION (versao do COPYING.LIB e da oferta de fonte). Trocar third-party/ e as constantes."
            exit 1
          fi
          case "$CYGWIN_COPYING_LIB" in
            "third-party/cygwin-${CYGWIN_RUNTIME_VERSION%-*}/"*) ;;
            *) echo "::error::$CYGWIN_COPYING_LIB nao e do diretorio da versao ${CYGWIN_RUNTIME_VERSION%-*}"; exit 1 ;;
          esac

      - name: Configure (sem OpenSSL)
        run: |
          export PATH=/usr/bin:/bin
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/iperf-src"
          ./configure --without-openssl --disable-shared --enable-static --prefix=/opt/iperf3 2>&1 | tee ../out/configure.log
          if ! grep -q 'Building without OpenSSL' ../out/configure.log; then
            echo '::error::configure nao emitiu "Building without OpenSSL": OpenSSL pode ter sido detectado'
            exit 1
          fi
          grep 'Building without OpenSSL' ../out/configure.log

      - name: Make
        run: |
          export PATH=/usr/bin:/bin
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/iperf-src"
          make -j"$(nproc)"
          make install

      - name: Verificar binario (versao, ajuda, DLLs)
        run: |
          export PATH=/usr/bin:/bin
          OUT="$(cygpath -u "$GITHUB_WORKSPACE")/out"
          EXE=/opt/iperf3/bin/iperf3.exe
          "$EXE" --version | tee "$OUT/version.txt"
          grep -q "iperf $IPERF_TAG" "$OUT/version.txt" || { echo "::error::--version nao mostra iperf $IPERF_TAG"; exit 1; }
          if grep -Eqi 'openssl|authentication' "$OUT/version.txt"; then
            echo '::error::--version menciona OpenSSL/authentication'; exit 1
          fi
          "$EXE" --help > "$OUT/help.txt" 2>&1 || true
          for opt in --json-stream --server-max-duration; do
            grep -q -- "$opt" "$OUT/help.txt" || { echo "::error::--help sem $opt"; exit 1; }
            echo "--help contem $opt"
          done
          if grep -q -- '--rsa' "$OUT/help.txt"; then echo '::error::--help oferece --rsa-*'; exit 1; fi
          echo '--help sem opcoes --rsa-*'
          cygcheck "$EXE" | tee "$OUT/cygcheck.txt"
          # Toda DLL fora de C:\Windows precisa estar na lista permitida.
          grep -Eio '[a-z]:\\[^ ]*\.dll' "$OUT/cygcheck.txt" | tr -d '\r' | sort -u > "$OUT/dlls-todas.txt"
          grep -Eiv '^[a-z]:\\windows\\' "$OUT/dlls-todas.txt" > "$OUT/dlls-fora-windows.txt" || true
          echo "DLLs fora de C:\\Windows:"; cat "$OUT/dlls-fora-windows.txt"
          ruim=0
          while IFS= read -r dll; do
            base="$(basename "$(cygpath -u "$dll")" | tr 'A-Z' 'a-z')"
            permitido=0
            for ok in $ALLOWED_DLLS; do [ "$base" = "$(echo "$ok" | tr 'A-Z' 'a-z')" ] && permitido=1; done
            if [ "$permitido" -ne 1 ]; then echo "::error::DLL fora da lista permitida: $dll"; ruim=1; fi
          done < "$OUT/dlls-fora-windows.txt"
          [ "$ruim" -eq 0 ] || exit 1
          echo "Lista permitida: $ALLOWED_DLLS -- OK"

      - name: Montar pacote
        run: |
          export PATH=/usr/bin:/bin
          WS="$(cygpath -u "$GITHUB_WORKSPACE")"
          PKG="$WS/pkg"
          mkdir -p "$PKG"
          cp /opt/iperf3/bin/iperf3.exe "$PKG/"
          for dll in $ALLOWED_DLLS; do cp "/usr/bin/$dll" "$PKG/"; done
          cp "$WS/iperf-src/LICENSE" "$PKG/LICENSE-iperf3.txt"
          CYGVER="$(cygcheck -c -d cygwin | awk '$1=="cygwin"{print $2}')"
          # Licenca do runtime: os arquivos que o proprio pacote cygwin instala.
          LIC="$(cygcheck -l cygwin | grep -Ei '/(copying|license|cygwin_license)[^/]*$' || true)"
          echo "Arquivos de licenca do pacote cygwin:"; echo "$LIC"
          [ -n "$LIC" ] || { echo '::error::licenca do runtime Cygwin nao encontrada'; exit 1; }
          : > "$PKG/COPYING-cygwin.txt"
          for f in $LIC; do printf '===== %s =====\n' "$f" >> "$PKG/COPYING-cygwin.txt"; cat "$f" >> "$PKG/COPYING-cygwin.txt"; printf '\n' >> "$PKG/COPYING-cygwin.txt"; done
          # LGPLv3 referenciada pelo CYGWIN_LICENSE; o pacote cygwin nao a instala. Hash ja conferido.
          cp "$WS/repo/$CYGWIN_COPYING_LIB" "$PKG/COPYING.LIB-cygwin.txt"
          cat > "$PKG/CYGWIN-SOURCE.txt" <<EOF
          cygwin1.dll (Cygwin $CYGVER) e distribuido sob a LGPLv3+ com a "Linking Exception"
          descrita em CYGWIN_LICENSE (dentro de COPYING-cygwin.txt). Texto da LGPLv3:
          COPYING.LIB-cygwin.txt. Texto da GPLv3 a que a LGPLv3 remete: COPYING-cygwin.txt.

          Fonte correspondente, da MESMA versao do runtime distribuido ($CYGVER):
            pacote de fonte: $CYGWIN_SRC_URL
            SHA-512 (setup.ini do espelho): $CYGWIN_SRC_SHA512
            repositorio:     $CYGWIN_SRC_GIT
          EOF
          cat > "$PKG/BUILD-MANIFEST.txt" <<EOF
          iperf3 para Windows (Cygwin), compilado sem OpenSSL.
          Desenho: Docs/banda-architecture/build-iperf3.md (D9).
          iperf tag:        $IPERF_TAG
          iperf commit:     $IPERF_COMMIT
          repositorio:      $GITHUB_REPOSITORY @ $GITHUB_SHA
          workflow run:     $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (tentativa $GITHUB_RUN_ATTEMPT)
          runner:           $ImageOS $ImageVersion
          cygwin:           $CYGVER
          COPYING.LIB:      $CYGWIN_COPYING_LIB sha256 $CYGWIN_COPYING_LIB_SHA256
          configure:        --without-openssl --disable-shared --enable-static --prefix=/opt/iperf3
          DLLs permitidas:  $ALLOWED_DLLS (fora de C:\\Windows)

          == toolchain ==
          $(cat "$WS/out/toolchain.txt")

          == iperf3 --version ==
          $(cat "$WS/out/version.txt")

          == cygcheck iperf3.exe ==
          $(cat "$WS/out/cygcheck.txt")
          EOF
          ls -la "$PKG"

      - name: Verificacao funcional (127.0.0.1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'pkg'
          $out = Join-Path $env:GITHUB_WORKSPACE 'out'
          $exe = Join-Path $pkg 'iperf3.exe'
          # PATH sem Cygwin: o pacote tem de rodar sozinho.
          if (($env:PATH -split ';') -match 'cygwin') { throw 'Cygwin no PATH: teste nao provaria o pacote' }
          $srv = Start-Process -FilePath $exe -ArgumentList '-s','-B','127.0.0.1','-p','5201','--server-max-duration','10' `
                   -PassThru -WindowStyle Hidden -RedirectStandardOutput "$out/server.log" -RedirectStandardError "$out/server.err"
          $srv.Id | Set-Content "$out/server.pid"
          $ok = $false
          foreach ($i in 1..30) {
            try { $c = [Net.Sockets.TcpClient]::new('127.0.0.1', 5201); $c.Close(); $ok = $true; break } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { throw 'servidor iperf3 nao abriu 127.0.0.1:5201' }
          Start-Sleep -Seconds 1

          function Invoke-Iperf([string[]]$a, [string]$file) {
            $o = & $exe @a 2>&1
            if ($LASTEXITCODE -ne 0) { $o | Out-String | Write-Host; throw "iperf3 $($a -join ' ') saiu com $LASTEXITCODE" }
            ($o | Out-String) | Set-Content -Encoding utf8 $file
            Start-Sleep -Seconds 1
          }
          Invoke-Iperf @('-c','127.0.0.1','-p','5201','-t','2','-J') "$out/normal.json"
          Invoke-Iperf @('-c','127.0.0.1','-p','5201','-t','2','-J','-R') "$out/reverse.json"
          Invoke-Iperf @('-c','127.0.0.1','-p','5201','-t','2','--json-stream') "$out/stream.jsonl"

          function Get-Prop($obj, [string]$name) { if ($null -ne $obj -and $obj.PSObject.Properties.Name -contains $name) { $obj.$name } else { $null } }
          function Get-Resumo([string]$file, [string]$sentido) {
            $j = Get-Content -Raw $file | ConvertFrom-Json
            $recv = Get-Prop (Get-Prop $j 'end') 'sum_received'
            $sent = Get-Prop (Get-Prop $j 'end') 'sum_sent'
            $temRetr = $null -ne $sent -and ($sent.PSObject.Properties.Name -contains 'retransmits')
            [ordered]@{
              sentido = $sentido
              received_bits_per_second = Get-Prop $recv 'bits_per_second'
              sum_sent_tem_retransmits = $temRetr
              sum_sent_retransmits = $(if ($temRetr) { $sent.retransmits } else { $null })
              sender_tcp_congestion = Get-Prop (Get-Prop $j 'end') 'sender_tcp_congestion'
            }
          }
          $linhas = @(Get-Content "$out/stream.jsonl" | Where-Object { $_.Trim() })
          $eventos = @($linhas | ForEach-Object { try { ($_ | ConvertFrom-Json).event } catch { '<nao-json>' } })
          $r = [ordered]@{
            normal  = Get-Resumo "$out/normal.json" 'normal (cliente envia)'
            reverso = Get-Resumo "$out/reverse.json" '-R (servidor envia)'
            json_stream = [ordered]@{
              linhas = $linhas.Count
              eventos = (($eventos | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }) -join ', ')
              objetos_por_intervalo = (@($eventos | Where-Object { $_ -eq 'interval' }).Count -ge 2)
              todas_linhas_json = -not ($eventos -contains '<nao-json>')
            }
          }
          $txt = $r | ConvertTo-Json -Depth 5
          $txt
          $txt | Set-Content -Encoding utf8 "$out/funcional.json"
          @('', '== verificacao funcional (127.0.0.1, -t 2) ==', $txt) | Add-Content -Encoding utf8 (Join-Path $pkg 'BUILD-MANIFEST.txt')
          if (-not $r.normal.received_bits_per_second -or -not $r.reverso.received_bits_per_second) { throw 'sum_received ausente em algum sentido' }
          if (-not $r.json_stream.objetos_por_intervalo -or -not $r.json_stream.todas_linhas_json) { throw '--json-stream nao emitiu objetos por intervalo' }
          "## Verificacao funcional`n``````json`n$txt`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Encerrar servidor iperf3
        if: always()
        shell: pwsh
        run: |
          $p = @(Get-Process -Name iperf3 -ErrorAction SilentlyContinue)
          "processos iperf3 ativos: $($p.Count)"
          $p | Stop-Process -Force -ErrorAction SilentlyContinue
          if (@(Get-Process -Name iperf3 -ErrorAction SilentlyContinue).Count) { throw 'iperf3 continua rodando' }

      - name: SHA256SUMS e zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'pkg'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          $sums = Get-ChildItem -File $pkg | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name }
          [IO.File]::WriteAllText((Join-Path $pkg 'SHA256SUMS'), (($sums -join "`n") + "`n"))
          $name = "iperf3-$env:IPERF_TAG-cygwin-x64-$env:GITHUB_RUN_NUMBER"
          $zip = Join-Path $dist "$name.zip"
          Compress-Archive -Path (Join-Path $pkg '*') -DestinationPath $zip
          $zh = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$zip.sha256", "$zh  $name.zip`n")
          "== SHA256SUMS (conteudo do zip) =="; Get-Content (Join-Path $pkg 'SHA256SUMS')
          "== zip =="; "$zh  $name.zip"
          "PACOTE=$name" | Add-Content $env:GITHUB_ENV
          @("## Hashes", '```', (Get-Content (Join-Path $pkg 'SHA256SUMS')), "$zh  $name.zip", '```') | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Artefato do workflow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACOTE }}
          path: |
            dist/
            out/
          if-no-files-found: error
          retention-days: 90

  publicar:
    # Release so com publicar=true. GitHub Actions so aceita permissions por JOB, nao por passo:
    # contents: write fica isolado neste job, que nao compila nada.
    needs: build
    if: ${{ inputs.publicar == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: iperf3-*
          path: artefato
          merge-multiple: true
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artefato/dist
          sha256sum -c ./*.zip.sha256
          TAG="iperf3-v${IPERF_TAG}-cygwin.${GITHUB_RUN_NUMBER}"
          {
            echo "iperf3 ${IPERF_TAG} para Windows (Cygwin, sem OpenSSL). Commit upstream ${IPERF_COMMIT}."
            echo "Desenho: Docs/banda-architecture/build-iperf3.md (D9). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat ./*.zip.sha256
            echo '```'
          } > notas.md
          # --latest=false: esta release nao e a da aplicacao e nao pode virar "Latest" do repositorio.
          gh release create "$TAG" ./*.zip ./*.zip.sha256 --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notas.md --latest=false
